<form [formGroup]="autotuneForm" *ngIf="autotuneForm" class="card p-4">
  <h2 class="text-xl font-bold mb-4 text-main">Autotune Settings</h2>

  <div class="rounded p-3 bg-yellow-950/20 border border-yellow-800 text-yellow-200 mb-4 text-sm flex items-center gap-2">
    <i class="pi pi-exclamation-triangle text-yellow-500"></i>
    <span><strong>Warning:</strong> The following options should only be set by expert users.</span>
  </div>

  <div class="space-y-4">
    <div class="flex items-center gap-3">
      <input type="checkbox" id="auto_tune" formControlName="auto_tune"
        class="h-4 w-4 accent-primary rounded cursor-pointer">
      <label for="auto_tune" class="text-sm font-medium cursor-pointer flex items-center gap-2 text-main">
        Auto Tune Hashrate
        <tooltip-text-icon text="Auto Tune" tooltip="Enables automatic tuning of hashrate based on system conditions." />
      </label>
    </div>

    @if (autotuneForm.get('auto_tune')?.value) {
      @for (slider of sliderConfigs; track slider.formControlName) {
        <div class="flex flex-col md:flex-row md:items-center gap-2 py-2 border-b border-surface last:border-b-0">
          <div class="md:w-1/3 text-sm font-medium text-secondary">
            <tooltip-text-icon [text]="slider.label" [tooltip]="slider.tooltip" />
          </div>
          <div class="md:w-2/3 flex flex-col gap-1">
            <div class="flex justify-between text-xs text-secondary">
              <span class="md:hidden font-medium">{{ slider.label }}:</span>
              <span class="font-semibold text-main">{{ autotuneForm.value[slider.formControlName] }} {{ slider.unit }}</span>
            </div>
            <input type="range" [id]="slider.formControlName" [formControlName]="slider.formControlName"
              [min]="slider.min" [max]="slider.max" [step]="slider.step"
              class="w-full h-2 bg-surface rounded-lg appearance-none cursor-pointer accent-primary cyber-slider" [style.background]="'linear-gradient(to right, var(--color-primary) ' + (((autotuneForm.value[slider.formControlName] || 0) - (slider.min || 0)) / ((slider.max || 100) - (slider.min || 0)) * 100) + '%, var(--slider-bg, #dee2e6) ' + (((autotuneForm.value[slider.formControlName] || 0) - (slider.min || 0)) / ((slider.max || 100) - (slider.min || 0)) * 100) + '%)'">
          </div>
        </div>
      }
    }
  </div>

  <div class="flex mt-6 gap-3">
    <button type="button" class="btn" (click)="updateAutotune()"
      [disabled]="!autotuneForm.dirty || autotuneForm.invalid">
      Save
    </button>
  </div>
</form>
