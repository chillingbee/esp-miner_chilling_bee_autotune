<form [formGroup]="autotuneForm" *ngIf="autotuneForm" class="p-4">
    <div class="bg-card p-4 rounded-lg shadow-md">
        <h2 class="text-xl font-bold mb-4">Autotune Settings</h2>

        <!-- Warning Message -->
        <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 mb-4 rounded-sm text-sm" role="alert">
            <span class="font-semibold">Warning:</span> The following options should only be set by expert users.
        </div>

        <div class="space-y-4">
            <!-- Auto Tune Hashrate Checkbox -->
            <div class="flex items-center space-x-3 my-2">
                <input type="checkbox" id="auto_tune" formControlName="auto_tune" 
                    class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                <label for="auto_tune" class="text-sm font-medium cursor-pointer">
                    <tooltip-text-icon text="Auto Tune Hashrate"
                        tooltip="Enables automatic tuning of hashrate based on system conditions. This feature adjusts the hashrate dynamically to optimize performance and efficiency." />
                </label>
            </div>

            <!-- Slider Controls -->
            <ng-container *ngIf="autotuneForm.get('auto_tune')?.value">
                <div *ngFor="let slider of sliderConfigs" class="flex flex-col md:flex-row md:items-center my-3 gap-2">
                    <div class="md:w-1/3">
                        <tooltip-text-icon [text]="slider.label" [tooltip]="slider.tooltip" />
                    </div>
                    <div class="md:w-2/3 flex flex-col">
                        <div class="flex justify-between text-sm mb-1">
                            <span class="md:hidden">{{ slider.label }}:</span>
                            <span class="font-semibold">{{ autotuneForm.value[slider.formControlName] }} {{ slider.unit }}</span>
                        </div>
                        <input type="range" [id]="slider.formControlName" [formControlName]="slider.formControlName"
                            [min]="slider.min" [max]="slider.max" [step]="slider.step"
                            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    </div>
                </div>
            </ng-container>
        </div>

        <div class="flex mt-6 gap-3">
            <button type="button" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-md shadow hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed"
                (click)="updateAutotune()"
                [disabled]="!autotuneForm.dirty || autotuneForm.invalid">
                Save
            </button>
        </div>
    </div>
</form>
