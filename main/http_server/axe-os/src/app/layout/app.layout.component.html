<div class="layout-wrapper" [ngClass]="containerClass">
  <app-topbar [isAPMode]="isAPMode"></app-topbar>
  @if (!isAPMode) {
    <div class="layout-sidebar">
      <app-sidebar></app-sidebar>
    </div>
  }
  <div class="layout-main-container">
    <div class="layout-main">
      <router-outlet></router-outlet>
    </div>
    <app-footer></app-footer>
  <div *ngIf="layoutService.config().colorScheme === 'cyberpunk'" class="fixed bottom-2 right-2 text-[10px] text-cyan-300 opacity-60 font-mono pointer-events-none z-50 select-none" aria-label="Credit">
    designed by chilling_bee with claude
  </div>
  </div>

  <div class="layout-mask"></div>
  <app-loading
    [ngClass]="{'menuIsVisible': !layoutService.state.staticMenuDesktopInactive}"
  ></app-loading>
</div>
